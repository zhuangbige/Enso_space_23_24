<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/conf.d</include>
  <cachedir>/private/tmp/codex-fontconfig-cache</cachedir>
  <alias>
    <family>serif</family>
    <prefer><family>Songti SC</family><family>STSong</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Heiti SC</family><family>PingFang SC</family></prefer>
  </alias>
</fontconfig>
